let cur = 'all';
const grid = document.getElementById('grid');
const search = document.getElementById('search');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  const q = search.value.toLowerCase();
  const list = ITEMS.filter(p => (cur==='all'||p[4]===cur) && (!q || p[1].toLowerCase().includes(q) || p[2].toLowerCase().includes(q) || p[0].toLowerCase().includes(q)));
  for (const k of Object.keys(CATS)) {
    const el = document.getElementById('cnt-'+k);
    if (el) el.textContent = '('+ITEMS.filter(p=>p[4]===k).length+')';
  }
  document.getElementById('cnt-all').textContent = '('+ITEMS.length+')';
  grid.innerHTML = list.length ? list.map(p=>'<div class="card"><h3>'+(p[5]?'<img class="ticon" src="'+p[5]+'" loading="lazy">':'')+'<span>'+esc(p[1])+'<span class="badge">'+esc(p[3])+'</span><span class="cat">'+esc(CATS[p[4]]||p[4])+'</span></span></h3><p>'+esc(p[2])+'</p><span class="code">'+esc(p[0])+'</span></div>').join('') : '<div class="empty">Ничего не найдено</div>';
}
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('.nav-tab'); if(!b) return;
  document.querySelectorAll('.nav-tab').forEach(n=>n.classList.remove('active'));
  b.classList.add('active'); cur = b.dataset.cat; render();
});
search.addEventListener('input', render);
render();
</script>
